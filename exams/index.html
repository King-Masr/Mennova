<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>امتحان منظمات دولية</h1>
  </header>
  <main>
    <section class="quiz-container">
      <select title="questions" id="section-selector" onchange="loadQuestion(this.value)">
        <option value="0">Q. 1</option>
        <option value="1">Q. 2</option>
        <option value="2">Q. 3</option>
        <option value="3">Q. 4</option>
        <option value="4">Q. 5</option>
        <option value="5">Q. 6</option>
        <option value="6">Q. 7</option>
        <option value="7">Q. 8</option>
        <option value="8">Q. 9</option>
        <option value="9">Q. 10</option>
      </select>
      <div class="question-container">
        <h2 id="question"></h2>
        <ul id="answers">
          <!-- Answers will be generated dynamically -->
        </ul>
        <section id="options">
          <button type="button" id="prev-btn" class="btn">Previous</button>
          <button type="button" id="next-btn" class="btn">Next</button>
        </section>
      </div>
    </section>
    <div class="result-container" id="result-container">
      <h2>Quiz Results</h2>
      <hr>
      <div id="results"></div>
      <div id="percentage"></div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
