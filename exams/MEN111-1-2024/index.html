<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان منظمات دولية</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>امتحان منظمات دولية</h1>
    </header>
    <main>
      <section class="quiz-container">
        <select title="questions" id="section-selector" onchange="loadQuestion(this.value)">
          <!-- Questions will be generated dynamically -->
        </select>
        <div class="question-container">
          <h2 id="question"></h2>
          <ul id="answers">
            <!-- Answers will be generated dynamically -->
          </ul>
          <section id="options">
            <button type="button" id="prev-btn" class="btn">السؤال السابق</button>
            <button type="button" id="next-btn" class="btn">السؤال التالي</button>
          </section>
        </div>
      </section>
      <div class="result-container" id="result-container">
        <h2>نتيجة الامتحان</h2>
        <hr>
        <div id="results"></div>
        <div id="percentage"></div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
